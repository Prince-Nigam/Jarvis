<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S</title>
    <link rel="shortcut icon" href="assets/img/logo.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══════════════════════ BOOT SCREEN ═══════════════════════ -->
<div id="BootScreen">
    <div class="boot-bg"></div>
    <div class="boot-content">
        <div class="boot-logo-ring">
            <svg class="ring r1" viewBox="0 0 200 200"><circle cx="100" cy="100" r="90" stroke="#00d4ff" stroke-width="1" fill="none" stroke-dasharray="4 8"/></svg>
            <svg class="ring r2" viewBox="0 0 200 200"><circle cx="100" cy="100" r="75" stroke="#0088cc" stroke-width="1.5" fill="none" stroke-dasharray="1 6"/></svg>
            <svg class="ring r3" viewBox="0 0 200 200"><circle cx="100" cy="100" r="58" stroke="#00d4ff" stroke-width="2" fill="none" stroke-dasharray="20 5"/></svg>
            <div class="boot-core">
                <div class="boot-core-inner"></div>
            </div>
        </div>
        <div class="boot-title">J.A.R.V.I.S</div>
        <div class="boot-subtitle">JUST A RATHER VERY INTELLIGENT SYSTEM</div>
        <div class="boot-bar-wrap"><div class="boot-bar" id="bootBar"></div></div>
        <div class="boot-status" id="bootStatus">INITIALIZING SYSTEMS...</div>
    </div>
</div>

<!-- ═══════════════════════ DASHBOARD ═══════════════════════ -->
<div id="Dashboard" class="hidden">

    <!-- ── HEADER ── -->
    <header class="jv-header">
        <div class="hdr-left">
            <div class="hdr-logo">J.A.R.V.I.S</div>
            <div class="hdr-tagline">ONLINE</div>
        </div>
        <div class="hdr-center">
            <div class="hdr-time" id="hdrTime">00:00:00</div>
            <div class="hdr-date" id="hdrDate">--</div>
        </div>
        <div class="hdr-right">
            <div class="hdr-stat" id="hdrCpu"><i class="bi bi-cpu"></i><span id="hdrCpuVal">0%</span></div>
            <div class="hdr-stat" id="hdrRam"><i class="bi bi-memory"></i><span id="hdrRamVal">0%</span></div>
            <div class="hdr-stat" id="hdrBat"><i class="bi bi-battery-half" id="hdrBatIcon"></i><span id="hdrBatVal">--%</span></div>
            <div class="status-pill" id="statusPill">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">STANDBY</span>
            </div>
        </div>
    </header>

    <!-- ── MAIN BODY ── -->
    <div class="jv-body">

        <!-- LEFT PANEL -->
        <aside class="jv-left">

            <!-- System stats -->
            <div class="jv-card">
                <div class="jv-card-title"><i class="bi bi-activity"></i> SYSTEM MONITOR</div>
                <div class="stat-item">
                    <div class="stat-lbl"><i class="bi bi-cpu-fill"></i> CPU</div>
                    <div class="stat-track"><div class="stat-fill s-blue" id="cpuBar" style="width:0%"></div></div>
                    <div class="stat-num" id="cpuVal">0%</div>
                </div>
                <div class="stat-item">
                    <div class="stat-lbl"><i class="bi bi-memory"></i> RAM</div>
                    <div class="stat-track"><div class="stat-fill s-cyan" id="ramBar" style="width:0%"></div></div>
                    <div class="stat-num" id="ramVal">0 GB</div>
                </div>
                <div class="stat-item">
                    <div class="stat-lbl"><i class="bi bi-device-hdd"></i> DISK</div>
                    <div class="stat-track"><div class="stat-fill s-orange" id="diskBar" style="width:0%"></div></div>
                    <div class="stat-num" id="diskVal">0 GB</div>
                </div>
                <div class="stat-badges">
                    <div class="stat-badge"><i class="bi bi-thermometer-half" style="color:#ff6a00"></i><span id="tempVal">-- °C</span></div>
                    <div class="stat-badge"><i class="bi bi-battery-half" id="batIcon" style="color:#00d4ff"></i><span id="batVal">--%</span></div>
                </div>
            </div>

            <!-- Quick commands -->
            <div class="jv-card">
                <div class="jv-card-title"><i class="bi bi-lightning-charge-fill"></i> QUICK LAUNCH</div>
                <div class="quick-grid">
                    <button class="qbtn" data-cmd="open youtube"><i class="bi bi-youtube"></i>YouTube</button>
                    <button class="qbtn" data-cmd="open google"><i class="bi bi-google"></i>Google</button>
                    <button class="qbtn" data-cmd="open whatsapp"><i class="bi bi-whatsapp"></i>WhatsApp</button>
                    <button class="qbtn" data-cmd="open spotify"><i class="bi bi-music-note-beamed"></i>Spotify</button>
                    <button class="qbtn" data-cmd="open notepad"><i class="bi bi-file-text"></i>Notepad</button>
                    <button class="qbtn" data-cmd="open calculator"><i class="bi bi-calculator"></i>Calc</button>
                    <button class="qbtn" data-cmd="what time is it"><i class="bi bi-clock"></i>Time</button>
                    <button class="qbtn" data-cmd="open chrome"><i class="bi bi-browser-chrome"></i>Chrome</button>
                </div>
            </div>

            <!-- File Explorer -->
            <div class="jv-card jv-card-grow">
                <div class="jv-card-title">
                    <i class="bi bi-folder2-open"></i> FILE EXPLORER
                    <button id="openInExplorerBtn" class="icon-btn ms-auto" title="Open in Explorer"><i class="bi bi-box-arrow-up-right"></i></button>
                </div>
                <div id="fileBreadcrumb" class="breadcrumb-row"><span class="bc-item" data-path="">Drives</span></div>
                <div id="fileList" class="file-list"></div>
            </div>

        </aside>

        <!-- CENTER -->
        <main class="jv-center">

            <!-- IDLE VIEW -->
            <section id="IdleView">
                <div class="bubble-wrap">
                    <canvas id="particleCanvas"></canvas>
                </div>
                <div class="last-resp" id="lastResponse"></div>
                <div class="cmd-bar">
                    <input type="text" id="chatbox" class="cmd-input" placeholder="Type a command...">
                    <button id="SendBtn" class="cmd-btn" hidden><i class="bi bi-send-fill"></i></button>
                    <button id="MicBtn" class="cmd-btn mic-btn"><i class="bi bi-mic-fill"></i></button>
                    <button id="ChatBtn" class="cmd-btn" data-bs-toggle="offcanvas" data-bs-target="#chatCanvas"><i class="bi bi-chat-dots-fill"></i></button>
                </div>

                <!-- Phone Voice Panel — sirf phone pe dikhega -->
                <div id="phoneVoicePanel" class="phone-voice-panel">
                    <button id="PhoneWakeBtn" class="phone-wake-btn" title="Tap to enable phone voice">
                        🎤
                    </button>
                    <span id="phoneWakeLabel" class="phone-wake-label">Tap to enable phone voice</span>
                </div>
            </section>

            <!-- ACTIVE / SPEAKING VIEW — real SiriWave + message -->
            <section id="ActiveView" class="hidden">
                <div class="wave-wrap">
                    <div class="wave-msg" id="jarvisResponse">Listening...</div>
                    <div id="siri-container"></div>
                    <div class="wave-status" id="waveStatus">LISTENING</div>
                </div>
            </section>

        </main>

        <!-- RIGHT PANEL -->
        <aside class="jv-right">

            <!-- Activity log -->
            <div class="jv-card jv-card-grow">
                <div class="jv-card-title"><i class="bi bi-terminal-fill"></i> ACTIVITY LOG</div>
                <div id="terminalLog" class="term-log"></div>
            </div>

            <!-- Chat history preview -->
            <div class="jv-card">
                <div class="jv-card-title"><i class="bi bi-chat-square-dots-fill"></i> LAST COMMANDS</div>
                <div id="cmdHistory" class="cmd-history"></div>
            </div>

        </aside>

    </div><!-- /jv-body -->

</div><!-- /Dashboard -->

<!-- ── CHAT OFFCANVAS ── -->
<div class="offcanvas offcanvas-end jv-offcanvas" id="chatCanvas" tabindex="-1">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title">COMMAND HISTORY</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div id="chat-canvas-body" class="offcanvas-body"></div>
</div>

<!-- Scripts -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/siriwave/dist/siriwave.umd.min.js"></script>
<script src="canvas.js"></script>
<script src="main.js"></script>
<script src="controller.js"></script>
<script src="sysinfo.js"></script>
<script src="filebrowser.js"></script>
<script src="rightpanel.js"></script>
<script src="bg-animation.js"></script>
</body>
</html>
